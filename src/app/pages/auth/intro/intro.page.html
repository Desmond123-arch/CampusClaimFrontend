<div class="mt-6">
  <app-page-header></app-page-header>
</div>
<ion-content [fullscreen]="true" class="center-content">
  <div class="flex flex-col items-center justify-center h-full text-center inner-wrapper">
    <div class="w-[90%] max-w-xs">
      <ion-img src="/assets/intro.png"></ion-img>
    </div>

    <div class="my-6 px-6  lg:w-[35%] mx-auto">
      <h1 class="text-primary text-2xl md:text-3xl font-semibold">
        Lost & Found Made Easy
      </h1>
      <p class="mt-2 text-medium text-gray-600 w-[87%] mx-auto md:w-full text-center">
        Quickly report your lost items or help others Find theirs. together we
        can reunite what's been misplaced...
      </p>
    </div>

    <div class="w-full px-6">
      <ion-button
        expand="block"
        fill="clear"
        shape="round"
        color="light"
        class="started-btn"
        (click)="getStarted()"
      >
        Get Started
      </ion-button>
    </div>
  </div>
</ion-content>
