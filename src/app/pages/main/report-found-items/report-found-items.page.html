<ion-content class="items-container">
  <div class="flex items-center mt-10">
    <ion-buttons slot="start" class="button-container">
      <ion-back-button defaultHref="/main/home"></ion-back-button>
    </ion-buttons>
    <h1 class="w-full text-2xl font-semibold">Report {{reportType}} Item</h1>
  </div>
  <div class="w-90% md:w-[50%] mx-auto px-5">
    <app-found-item-form
      (formSubmitted)="onReportSubmit($event)"
      (ReportType)="changeReportType($event)"
      [isValid]="formSubmitSuccess"
    ></app-found-item-form>
  </div>
</ion-content>
