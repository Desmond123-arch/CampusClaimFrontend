<ion-content [fullscreen]="true" color="white">
  <div color="primary" class="main-toolbar bg-primary">
    <ion-row>
      <div class="w-14 h-14">
        <ion-img src="assets/icon/icon.svg"> </ion-img>
      </div>
      <ion-title>Hi {{name}}</ion-title>
      <div
        class="relative bg-indigo-200/20 px-4 rounded-md flex items-center shadow-md"
      >
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
    </ion-row>
  </div>
  <div class="floating-card">
    <p class="font-bold self-start text-start w-full">Lost Something?</p>
    <div class="w-full">
      <app-search-bar></app-search-bar>
    </div>
  </div>

  <div class="px-4 md:px-8">
    <!-- SKELETON -->
    <div *ngIf="isLoading">
      <section class="items-carousel-section">
        <div class="carousel-header">
          <h2 class="section-title">Found Items</h2>
          <!-- <a href="#" class="view-all-link">view all ›</a> -->
        </div>
        <div class="items-carousel-container">
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
        </div>
      </section>
    </div>
    <!-- FOUND_ITEMS -->
    <div *ngIf="!isLoading">
      <section class="items-carousel-section">
        <div class="carousel-header">
          <h2 class="section-title">Found Items</h2>
          <button (click)="navigateToFound('Found')" class="view-all-link">
            view all›
          </button>
        </div>

        <div class="items-carousel-container">
          <app-item-card
            *ngFor="let item of FoundItems"
            [item]="item"
            (click)="openItemDetail(item, $event)"
            style="cursor: pointer"
          ></app-item-card>
        </div>
      </section>
    </div>
  </div>

  <!-- LOST ITEMS -->
  <div class="px-4 md:px-8">
    <!-- SKELETON -->
    <div *ngIf="isLoading">
      <section class="items-carousel-section">
        <div class="carousel-header">
          <h2 class="section-title">Lost Items</h2>
          <!-- <a href="/items" class="view-all-link">view all ›</a> -->
        </div>
        <div class="items-carousel-container">
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
          <app-item-card-skeleton></app-item-card-skeleton>
        </div>
      </section>
    </div>

    <div *ngIf="!isLoading">
      <section class="items-carousel-section">
        <div class="carousel-header">
          <h2 class="section-title">Lost Items</h2>
          <button (click)="navigateToFound('Lost')" class="view-all-link">
            view all ›
          </button>
        </div>

        <div class="items-carousel-container">
          <app-item-card
            *ngFor="let item of Lostitems"
            [item]="item"
            (click)="openItemDetail(item, $event)"
            style="cursor: pointer"
          ></app-item-card>
        </div>
      </section>
    </div>
  </div>
</ion-content>
