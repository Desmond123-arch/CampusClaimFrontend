<div class="item-card">
  <div class="card-header">
    <ion-img [src]="item.imageUrl" class="item-image"></ion-img>
    <div class="item-details">
      <h3 class="item-title">{{ item.title }}</h3>
      <span class="status-tag">{{ item.status }}</span>
    </div>
  </div>
  <div class="info-line">
    <div class="info-item">
      <ion-icon name="location-outline" class="info-icon"></ion-icon>
      <span>{{ item.location }}</span>
    </div>
    <span class="dot">•</span>
    <div class="info-item">
      <span>{{ item.date }}</span>
    </div>
  </div>
  <ion-button expand="block" class="claim-button">Claim</ion-button>
  <p class="notification-text">
    You'll be notified within 24hours once your claim is reviewed
  </p>
</div>
