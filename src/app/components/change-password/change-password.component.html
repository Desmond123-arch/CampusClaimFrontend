<ion-content class="ion-padding">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-semibold">Change Password</h1>
    <ion-button fill="clear" (click)="dismiss()">Close</ion-button>
  </div>

  <form #form="ngForm" (ngSubmit)="onSubmit(form)" class="space-y-6">
    <div>
      <input type="password" name="currentPassword" placeholder="Current Password" ngModel required
             class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <input type="password" name="newPassword" placeholder="New Password" ngModel required
             class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <input type="password" name="confirmPassword" placeholder="Confirm New Password" ngModel required
             class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button type="submit" [disabled]="!form.valid"
            class="w-full py-3 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50">
      Save Changes
    </button>
  </form>
</ion-content>
