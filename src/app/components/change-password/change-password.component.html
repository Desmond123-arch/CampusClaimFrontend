<ion-content class="ion-padding">
  <div class="flex flex-col items-center justify-center">
    <div class="w-full max-w-sm">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-semibold">Change Password</h1>
        <ion-button fill="clear" (click)="dismiss()">Close</ion-button>
      </div>

      <form
        [formGroup]="changePasswordForm"
        (ngSubmit)="onSubmit()"
        class="space-y-6"
      >
        <div class="flex items-center relative">
          <input
            #password
            [type]="showPassword.old ? 'password' : 'text'"
            name="currentPassword"
            placeholder="Current Password"
            formControlName="currentPassword"
            required
            class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <ion-icon
            slot="icon-only"
            [name]="showPassword.old ? 'eye-off-outline' : 'eye-outline'"
            (click)="ChangeShowPassword('old')"
          ></ion-icon>
        </div>
        <div>
          <div class="flex items-center relative">
            <input
              [type]="showPassword.new ? 'password' : 'text'"
              name=""
              placeholder="New Password"
              formControlName="newPassword"
              class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <ion-icon
              slot="icon-only"
              [name]="showPassword.new ? 'eye-off-outline' : 'eye-outline'"
              (click)="ChangeShowPassword('new')"
            ></ion-icon>
          </div>
          <div
            *ngIf="
              changePasswordForm.controls['newPassword'].invalid &&
              (changePasswordForm.controls['newPassword'].dirty ||
                changePasswordForm.controls['newPassword'].touched)
            "
            class="text-xs text-red-600 dark:text-red-400 text-start mt-1 error-container"
          >
            <div
              *ngIf="
                changePasswordForm.controls['newPassword'].hasError('required')
              "
            >
              Password is required.
            </div>
            <div
              *ngIf="
                changePasswordForm.controls['newPassword'].hasError('minLength')
              "
            >
              Password must be at least 8 characters long.
            </div>
            <div
              *ngIf="
                changePasswordForm.controls['newPassword'].hasError(
                  'requireDigit'
                )
              "
            >
              Password must contain at least one number.
            </div>
            <!-- Add other strength errors as needed -->
            <div
              *ngIf="
                changePasswordForm.controls['newPassword'].hasError(
                  'requiredUppercase'
                )
              "
            >
              Password must contain an uppercase letter.
            </div>
            <div
              *ngIf="
                changePasswordForm.controls['newPassword'].hasError(
                  'requireSpecialChar'
                )
              "
            >
              Password must contain a special character.
            </div>
          </div>
        </div>

        <div>
          <div class="flex items-center relative">
            <input
              [type]="showPassword.confirm ? 'password' : 'text'"
              name="confirmPassword"
              placeholder="Confirm New Password"
              formControlName="confirmPassword"
              class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <ion-icon
              slot="icon-only"
              [name]="showPassword.confirm ? 'eye-off-outline' : 'eye-outline'"
              (click)="ChangeShowPassword('confirm')"
            ></ion-icon>
          </div>
          <div
          *ngIf="changePasswordForm.controls['confirmPassword'].invalid && (changePasswordForm.controls['confirmPassword'].dirty || changePasswordForm.controls['confirmPassword'].touched)"
          class="text-xs text-red-600 dark:text-red-400 text-start mt-1 error-container"
        >
          <div
            *ngIf="changePasswordForm.controls['confirmPassword'].invalid && (changePasswordForm.controls['confirmPassword'].dirty || changePasswordForm.controls['confirmPassword'].touched)"
            class="text-xs text-red-600 dark:text-red-400 text-start mt-1 error-container"
          >
            <div
              *ngIf="changePasswordForm.controls['confirmPassword'].hasError('required')"
            >
              Please confirm your password.
            </div>
            <div
              *ngIf="changePasswordForm.controls['confirmPassword'].hasError('passwordsMatch')"
            >
              Passwords do not match.
            </div>
          </div>
        </div>
        </div>
        <button
          (click)="onSubmit()"
          type="submit"
          class="w-full py-3 font-semibold text-white bg-blue-600 rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50"
        >
          Save Changes
        </button>
      </form>
    </div>
  </div>
</ion-content>
