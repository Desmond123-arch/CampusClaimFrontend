<ion-content class="ion-padding">
  <div class="flex flex-col items-center justify-center">
    <div class="w-full max-w-sm">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-semibold">Change Password</h1>
        <ion-button fill="clear" (click)="dismiss()">Close</ion-button>
      </div>

      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <input #password type="password" name="currentPassword" placeholder="Current Password" ngModel required
                 class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <input type="password" name="newPassword" placeholder="New Password" formControlName="newPassword"
                 class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <input type="password" name="confirmPassword" placeholder="Confirm New Password" formControlName="confirmPassword"
                 class="w-full px-4 py-3 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
                class="w-full py-3 font-semibold text-white bg-blue-600 rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50">
          Save Changes
        </button>
      </form>
    </div>
  </div>
</ion-content>
